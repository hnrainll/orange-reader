[package]
name = "orange-reader-webview-spike"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
dirs = "6"
gpui-kit = { version = "0.9.0", features = ["gpui-fast"] }
gpui-webview = { version = "0.9.0", features = ["gpui-fast"] }
percent-encoding = "2"
roxmltree = "0.20"
rusqlite = { version = "0.37", features = ["bundled"] }
scraper = "0.24"
uuid = { version = "1", features = ["v4"] }
wry = { package = "lb-wry", version = "0.53.3" }
zip = "2"
