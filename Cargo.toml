[package]
name = "orange-reader"
version = "2.0.0"
edition = "2024"
description = "macOS EPUB reader with GPUI Kit and foliate-js"

[dependencies]
anyhow = "1"
dirs = "6"
gpui-kit = { version = "0.9.0", features = ["gpui-fast"] }
gpui-webview = { version = "0.9.0", features = ["gpui-fast"] }
percent-encoding = "2"
roxmltree = "0.20"
rust-embed = { version = "8", features = ["debug-embed"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
wry = { package = "lb-wry", version = "0.53.3" }
zip = "2"

[profile.dev]
debug = 0

