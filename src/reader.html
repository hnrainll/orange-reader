<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orange Reader</title>
<style>
  body { margin: 0; font: 14px -apple-system, BlinkMacSystemFont, sans-serif; color: #31281f; background: #fffaf3; }
  header { display: flex; gap: 10px; align-items: center; height: 34px; padding: 0 16px; border-bottom: 1px solid #eadfd2; box-sizing: border-box; }
  button { border: 1px solid #d8c8b7; border-radius: 6px; background: white; padding: 6px 12px; cursor: pointer; }
  #status { color: #74685c; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #reader { height: calc(100vh - 34px); }
  #panel { display: none; position: absolute; z-index: 10; top: 34px; bottom: 0; left: 0;
    width: min(340px, 80vw); overflow: auto; background: #fffaf3; border-right: 1px solid #eadfd2;
    box-shadow: 3px 0 14px #0002; padding: 12px; box-sizing: border-box; }
  #panel.open { display: block; }
  #panel button { display: block; width: 100%; text-align: left; margin: 3px 0; }
  #panel .nested { padding-left: 24px; }
  #panel .note { border-bottom: 1px solid #eadfd2; padding: 8px 0; }
  #panel .colors { display: flex; gap: 4px; }
  #panel .colors button { width: 32px; height: 28px; flex: none; }
  #selection-tools { display: none; position: absolute; z-index: 20; padding: 6px;
    border: 1px solid #d8c8b7; border-radius: 8px; background: #fffaf3;
    box-shadow: 0 4px 18px #0003; gap: 5px; }
  #selection-tools.open { display: flex; }
  #selection-tools button { width: 28px; height: 28px; padding: 0; }
  foliate-view { display: block; width: 100%; height: 100%; }
  body.dark { color: #f5f5f7; background: #1c1c1e; }
  body.dark header { border-color: #403b37; }
  body.dark #status { color: #a1a1a6; }
  body.dark button { color: #f5f5f7; background: #302b28; border-color: #5b5148; }
  body.dark #panel { color: #f5f5f7; background: #242426; border-color: #403b37; }
  body.dark #selection-tools { background: #242426; border-color: #5b5148; }
</style>
<header>
  <span id="status">正在载入…</span>
</header>
<main id="reader"></main>
<aside id="panel"></aside>
<div id="selection-tools"></div>
<script type="module">
  import '/foliate-js/view.js'
  import { Overlayer } from '/foliate-js/overlayer.js'

  const status = document.getElementById('status')
  const reader = document.getElementById('reader')
  const panel = document.getElementById('panel')
  const selectionTools = document.getElementById('selection-tools')
  let panelKind = null
  const colors = ['#FFE066', '#86EFAC', '#93C5FD', '#F9A8D4', '#FCA5A5']
  let managed = false
  const report = (kind, detail = {}) => {
    const message = JSON.stringify({ kind, managed, ...detail })
    window.ipc?.postMessage(message)
    console.log('reader event:', message)
  }

  let view
  let lastSelection
  let lastLocation
  let savedAnnotations = []
  function hideSelectionTools() { selectionTools.classList.remove('open') }
  function showSelectionTools(doc, range, cfi, text) {
    lastSelection = { cfi, text }
    selectionTools.replaceChildren()
    for (const color of colors) {
      const button = document.createElement('button')
      button.style.backgroundColor = color
      button.title = '高亮文字'
      button.onmousedown = event => event.preventDefault()
      button.onclick = () => highlightSelection(color)
      selectionTools.append(button)
    }
    if (savedAnnotations.some(item => item.cfi === cfi)) {
      const remove = document.createElement('button')
      remove.textContent = '×'
      remove.title = '删除高亮'
      remove.onclick = () => deleteHighlight(cfi)
      selectionTools.append(remove)
    }
    const frame = doc.defaultView?.frameElement
    const frameRect = frame?.getBoundingClientRect()
    const rangeRect = range?.getBoundingClientRect()
    const x = (frameRect?.left || 0) + (rangeRect?.left || 0)
    const y = (frameRect?.top || 0) + (rangeRect?.top || 0) - 46
    selectionTools.style.left = `${Math.max(8, Math.min(window.innerWidth - 190, x))}px`
    selectionTools.style.top = `${Math.max(8, y)}px`
    selectionTools.classList.add('open')
  }
  async function deleteHighlight(cfi) {
    await view?.deleteAnnotation({ value: cfi })
    savedAnnotations = savedAnnotations.filter(item => item.cfi !== cfi)
    report('annotation-delete', { cfi })
    hideSelectionTools()
    if (panelKind === 'notes') renderPanel()
  }
  function closePanel() { panel.classList.remove('open'); panelKind = null }
  function showPanel(kind) {
    if (panelKind === kind) { closePanel(); return }
    panelKind = kind
    panel.classList.add('open')
    renderPanel()
  }
  function renderPanel() {
    panel.replaceChildren()
    const heading = document.createElement('h3')
    heading.textContent = panelKind === 'toc' ? '目录' : '高亮'
    panel.append(heading)
    if (panelKind === 'toc') {
      const addItems = (items, depth = 0) => {
        for (const item of items || []) {
          const button = document.createElement('button')
          button.textContent = item.label || item.href || '未命名章节'
          if (depth) button.classList.add('nested')
          button.onclick = () => { view?.goTo(item.href); closePanel() }
          panel.append(button)
          addItems(item.subitems, depth + 1)
        }
      }
      addItems(view?.book?.toc)
    } else if (panelKind === 'notes') {
      if (!savedAnnotations.length) {
        const empty = document.createElement('p')
        empty.textContent = '暂无高亮。在书页中选中文字即可添加。'
        panel.append(empty)
        return
      }
      for (const annotation of savedAnnotations) {
        const row = document.createElement('div')
        row.className = 'note'
        const jump = document.createElement('button')
        jump.textContent = annotation.text || annotation.cfi
        jump.onclick = () => { view?.goTo(annotation.cfi); closePanel() }
        row.append(jump)
        const swatches = document.createElement('div')
        swatches.className = 'colors'
        for (const color of colors) {
          const button = document.createElement('button')
          button.style.backgroundColor = color
          button.title = '更改高亮颜色'
          button.onclick = async () => {
            annotation.color = color
            await view?.addAnnotation({ value: annotation.cfi, color, type: annotation.type })
            report('annotation-color', { cfi: annotation.cfi, color })
            renderPanel()
          }
          swatches.append(button)
        }
        row.append(swatches)
        const remove = document.createElement('button')
        remove.textContent = '删除高亮'
        remove.onclick = () => deleteHighlight(annotation.cfi)
        row.append(remove)
        panel.append(row)
      }
    }
  }
  let settings = { fontSize: 18, lineHeight: 1.6, contentWidth: 720,
    letterSpacing: 0, paragraphSpacing: 1, fontFamily: 'original', dark: false }
  function applySettings(next) {
    settings = { ...settings, ...next }
    document.body.classList.toggle('dark', settings.dark)
    if (!view?.renderer) return
    const css = `html, body {
      font-size: ${settings.fontSize}px !important;
      line-height: ${settings.lineHeight} !important;
      letter-spacing: ${settings.letterSpacing}em !important;
      -webkit-text-size-adjust: none;
      text-size-adjust: none;
      ${settings.dark ? 'background-color: #1c1c1e !important; color: #f5f5f7 !important;' : ''}
    }
    ${settings.fontFamily === 'original' ? '' : `html, body { font-family: ${settings.fontFamily === 'serif' ? 'Georgia, "Songti SC", serif' : '-apple-system, "PingFang SC", sans-serif'} !important; }`}
    p, li, blockquote { margin-bottom: ${settings.paragraphSpacing}em !important; }`
    view.renderer.setStyles?.(css)
    view.renderer.setAttribute?.('max-inline-size', `${settings.contentWidth}px`)
    report('settings-applied', settings)
  }
  window.applyReaderSettings = applySettings
  async function runSelfTest() {
    try {
      const toc = view.book?.toc || []
      showPanel('toc')
      const tocCount = panel.querySelectorAll('button').length
      if (toc.length < 2 || tocCount < 2) throw new Error('目录未载入')
      await view.goTo(toc[1].href)
      closePanel()

      const content = view.renderer.getContents().find(item => item.doc?.querySelector('p'))
      if (!content) throw new Error('章节内容未载入')
      const paragraph = content.doc.querySelector('p')
      const textNode = content.doc.createTreeWalker(paragraph, NodeFilter.SHOW_TEXT).nextNode()
      if (!textNode || !textNode.textContent) throw new Error('无法选取章节文字')
      const range = content.doc.createRange()
      range.setStart(textNode, 0)
      range.setEnd(textNode, Math.min(3, textNode.textContent.length))
      const cfi = view.getCFI(content.index, range)
      showSelectionTools(content.doc, range, cfi, range.toString())
      if (!selectionTools.classList.contains('open')) throw new Error('选字工具未显示')
      await highlightSelection('#86EFAC')
      if (savedAnnotations.find(item => item.cfi === cfi)?.color !== '#86EFAC')
        throw new Error('高亮创建失败')

      showSelectionTools(content.doc, range, cfi, range.toString())
      await selectionTools.children[2].onclick()
      if (savedAnnotations.find(item => item.cfi === cfi)?.color !== '#93C5FD')
        throw new Error('高亮改色失败')
      showPanel('notes')
      const remove = panel.querySelector('.note > button:last-child')
      if (!remove) throw new Error('高亮列表未显示删除按钮')
      await remove.onclick()
      if (savedAnnotations.some(item => item.cfi === cfi)) throw new Error('高亮删除失败')
      closePanel()
      report('self-test-complete', { tocCount, cfi })
    } catch (error) {
      report('self-test-error', { message: String(error) })
    }
  }
  function handleKeydown(event) {
    if (event.key === 'ArrowLeft' || event.key === 'PageUp') view?.goLeft()
    if (event.key === 'ArrowRight' || event.key === 'PageDown') view?.goRight()
  }
  window.addEventListener('keydown', handleKeydown)

  async function open(file, session = null) {
    view?.close?.()
    reader.replaceChildren()
    view = document.createElement('foliate-view')
    reader.append(view)
    status.textContent = '正在载入…'
    lastSelection = undefined
    lastLocation = undefined
    managed = session !== null
    savedAnnotations = session?.annotations || []
    const displayTitle = session?.title || file.name
    closePanel()
    hideSelectionTools()
    try {
      await view.open(file)
      applySettings(session?.settings || {})
      view.addEventListener('draw-annotation', event => {
        const { draw, annotation } = event.detail
        draw(annotation.type === 'underline' ? Overlayer.underline : Overlayer.highlight,
          { color: annotation.color })
      })
      view.addEventListener('show-annotation', event => {
        const annotation = savedAnnotations.find(item => item.cfi === event.detail.value)
        if (annotation) showSelectionTools(event.detail.range.startContainer.ownerDocument,
          event.detail.range, annotation.cfi, annotation.text || '')
      })
      view.addEventListener('relocate', event => {
        const { fraction, cfi, tocItem } = event.detail
        const chapter = tocItem?.label?.trim() || null
        status.textContent = `${displayTitle}${chapter ? ` · ${chapter}` : ''} · ${Math.round((fraction || 0) * 100)}%`
        const location = JSON.stringify({ fraction, cfi, chapter })
        if (location === lastLocation) return
        lastLocation = location
        report('relocate', { fraction, cfi, chapter })
      })
      view.addEventListener('load', event => {
        const { doc, index } = event.detail
        for (const annotation of savedAnnotations) {
          view.addAnnotation({ value: annotation.cfi, color: annotation.color, type: annotation.type })
            .catch(error => console.warn('无法恢复高亮', error))
        }
        doc.addEventListener('mouseup', () => {
          const selection = doc.getSelection()
          if (!selection || selection.isCollapsed || !selection.rangeCount) {
            hideSelectionTools()
            return
          }
          const text = selection.toString().trim()
          if (!text) return
          const cfi = view.getCFI(index, selection.getRangeAt(0))
          showSelectionTools(doc, selection.getRangeAt(0), cfi, text)
          report('selection', { text, cfi })
        })
        doc.addEventListener('keydown', handleKeydown)
      })
      const location = session?.location
      try {
        await view.init({ lastLocation: location || undefined, showTextStart: !location })
      } catch (error) {
        console.warn('无法恢复阅读位置，从开头打开', error)
        await view.init({ showTextStart: true })
      }
      if (savedAnnotations.length) {
        await Promise.all(savedAnnotations.map(annotation =>
          view.addAnnotation({ value: annotation.cfi, color: annotation.color, type: annotation.type })
            .catch(error => console.warn('无法恢复高亮', error))))
        report('annotations-restored', { count: savedAnnotations.length })
      }
      report('opened', { name: file.name })
      if (session?.selfTest) await runSelfTest()
      if (panelKind) renderPanel()
    } catch (error) {
      status.textContent = '打开失败：' + error.message
      report('error', { message: String(error) })
    }
  }

  async function highlightSelection(color = '#FFE066') {
    if (!view || !lastSelection?.cfi) {
      report('highlight-error', { message: '请先在书页里选中文字' })
      return
    }
    try {
      if (!colors.includes(color)) return
      const existing = savedAnnotations.find(item => item.cfi === lastSelection.cfi)
      await view.addAnnotation({ value: lastSelection.cfi, color,
        type: existing?.type || 'highlight' })
      if (existing) {
        existing.color = color
        report('annotation-color', { cfi: existing.cfi, color })
      } else {
        savedAnnotations.push({ cfi: lastSelection.cfi, color, type: 'highlight', text: lastSelection.text })
        report('highlight', { ...lastSelection, color })
      }
      hideSelectionTools()
      if (panelKind === 'notes') renderPanel()
    } catch (error) {
      report('highlight-error', { message: String(error) })
    }
  }
  window.readerFromRust = command => {
    if (command === 'next') view?.goRight()
    if (command === 'previous') view?.goLeft()
    if (command === 'highlight') highlightSelection()
    if (command === 'toc' || command === 'notes') showPanel(command)
    report('rust-command', { command })
  }
  report('ready')

  const response = await fetch('/book.epub')
  if (response.ok) {
    const sessionResponse = await fetch('/session.json')
    const session = sessionResponse.ok ? await sessionResponse.json() : null
    open(new File([await response.blob()], 'book.epub', { type: 'application/epub+zip' }), session)
  }
</script>
</html>
